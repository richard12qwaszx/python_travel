<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣旅遊景點推薦系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: "Microsoft JhengHei", "微軟正黑體", "PingFang TC", sans-serif;
            background-color: #f8f9fa;
            padding-top: 20px;
        }

        .card {
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .header-container {
            background-color: #17a2b8;
            color: white;
            padding: 30px 0;
            margin-bottom: 30px;
            border-radius: 10px;
        }

        .recommendation-score {
            font-size: 1.2rem;
            font-weight: bold;
            color: #28a745;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .visualization-container {
            margin-top: 30px;
            text-align: center;
        }

        .keywords-container {
            margin-bottom: 20px;
            padding: 10px;
            background-color: #f0f0f0;
            border-radius: 5px;
        }

        .keyword-badge {
            margin: 3px;
        }

        #visualization-img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header-container text-center">
            <h1>台灣旅遊景點推薦系統</h1>
            <p class="lead">基於圖神經網絡的智能推薦</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">請輸入您的旅遊偏好</h5>
                        <p class="card-text text-muted">例如：「我想要去玩水」、「適合拍照的地方」或「文化歷史景點」等</p>
                        <form id="recommendation-form">
                            <div class="input-group mb-3">
                                <input type="text" id="query" class="form-control" placeholder="輸入您的旅遊需求...">
                                <button class="btn btn-primary" type="submit">推薦景點</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div id="loading" class="loading">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p>正在為您尋找最適合的景點...</p>
                </div>

                <div id="keywords-container" class="keywords-container" style="display: none;">
                    <h5>識別到的關鍵詞：</h5>
                    <div id="keywords-list"></div>
                </div>

                <div id="results-container" style="display: none;">
                    <h3 class="mb-4">為您推薦的景點：</h3>
                    <div id="recommendations-list"></div>
                </div>

                <div id="visualization-container" class="visualization-container" style="display: none;">
                    <h3 class="mb-3">景點分布視覺化</h3>
                    <img id="visualization-img" src="" alt="景點分布視覺化">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('recommendation-form').addEventListener('submit', function (e) {
            e.preventDefault();

            const query = document.getElementById('query').value.trim();
            if (!query) {
                alert('請輸入有效的查詢內容');
                return;
            }

            // 顯示加載動畫
            document.getElementById('loading').style.display = 'block';
            document.getElementById('results-container').style.display = 'none';
            document.getElementById('keywords-container').style.display = 'none';
            document.getElementById('visualization-container').style.display = 'none';

            // 發送請求
            const formData = new FormData();
            formData.append('query', query);

            fetch('/recommend', {
                method: 'POST',
                body: formData
            })
                .then(response => response.json())
                .then(data => {
                    // 隱藏加載動畫
                    document.getElementById('loading').style.display = 'none';

                    if (data.error) {
                        alert(data.error);
                        return;
                    }

                    // 顯示關鍵詞
                    const keywordsContainer = document.getElementById('keywords-container');
                    const keywordsList = document.getElementById('keywords-list');
                    keywordsList.innerHTML = '';

                    if (data.keywords && data.keywords.length > 0) {
                        data.keywords.forEach(keyword => {
                            const badge = document.createElement('span');
                            badge.className = 'badge bg-info keyword-badge';
                            badge.textContent = keyword;
                            keywordsList.appendChild(badge);
                        });
                        keywordsContainer.style.display = 'block';
                    }

                    // 顯示推薦結果
                    const recommendationsList = document.getElementById('recommendations-list');
                    recommendationsList.innerHTML = '';

                    data.recommendations.forEach((rec, index) => {
                        const card = document.createElement('div');
                        card.className = 'card mb-3';

                        card.innerHTML = `
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center">
                                <h4 class="card-title">${index + 1}. ${rec.location}</h4>
                                <span class="recommendation-score">相關度: ${rec.score.toFixed(2)}</span>
                            </div>
                            <p class="card-text">${rec.reason}</p>
                            <div class="d-flex justify-content-between">
                                <small class="text-muted">評論數: ${rec.review_count}</small>
                                <small class="text-muted">平均評分: ${rec.avg_rating.toFixed(1)}/5</small>
                            </div>
                        </div>
                    `;

                        recommendationsList.appendChild(card);
                    });

                    document.getElementById('results-container').style.display = 'block';

                    // 顯示可視化
                    if (data.visualization) {
                        document.getElementById('visualization-img').src = 'data:image/png;base64,' + data.visualization;
                        document.getElementById('visualization-container').style.display = 'block';
                    }
                })
                .catch(error => {
                    document.getElementById('loading').style.display = 'none';
                    alert('發生錯誤，請稍後再試: ' + error);
                });
        });
    </script>
</body>

</html>
